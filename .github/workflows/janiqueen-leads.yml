name: Jani Queen leads

on:
  schedule:
    - cron: "17 9 * * *"   # every day ~4am Ottawa time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "janiqueen/collector/**"
      - "janiqueen/data/manual-sites.csv"
      - "janiqueen/data/builders-manual.json"

permissions:
  contents: write

concurrency:
  group: janiqueen-leads
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r janiqueen/collector/requirements.txt
      - run: python janiqueen/collector/collect.py
      - name: Commit updated data
        run: |
          git config user.name "jani-queen-bot"
          git config user.email "jani-queen-bot@users.noreply.github.com"
          git add janiqueen/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Jani Queen: refresh leads $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main && git rebase -X theirs origin/main && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          exit 1
