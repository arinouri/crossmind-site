<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#D08355">
<title>Crossmind Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#D08355;--orange-hi:#E39A6B;--navy:#0A2238;--navy-2:#0F2C47;--cream:#FAF3EA;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--orange);color:var(--navy);font-family:Inter,system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}

/* Intro (same as crossmind.ca) */
#intro{position:fixed;inset:0;background:var(--orange);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:auto}
.lock{display:flex;align-items:center;gap:clamp(16px,4vw,44px);padding:24px;transition:transform .7s cubic-bezier(.7,0,.3,1),opacity .5s}
.mark{width:clamp(130px,22vw,240px);flex:none;transition:width .7s cubic-bezier(.7,0,.3,1)}
.mark svg{display:block;width:100%;height:auto;overflow:visible}
.d{stroke-dasharray:1.02;stroke-dashoffset:1.02}
#intro.play .df{animation:draw .8s cubic-bezier(.55,0,.3,1) .25s forwards}
#intro.play .dh{animation:draw .16s cubic-bezier(.8,0,.3,1) 1.2s forwards}
#intro.play .dv{animation:draw .16s cubic-bezier(.8,0,.3,1) 1.5s forwards}
#intro.play .mark{animation:hit .22s ease 1.3s,hit2 .22s ease 1.6s}
#intro.all .d{animation:none;stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes hit{0%,100%{transform:none}35%{transform:translate(7px,-2px)}70%{transform:translate(-3px,1px)}}
@keyframes hit2{0%,100%{transform:none}35%{transform:translate(-2px,7px)}70%{transform:translate(1px,-3px)}}
.word{overflow:hidden}
.word .n{font:700 clamp(44px,9vw,104px)/1 "Space Grotesk",sans-serif;letter-spacing:-.04em;padding:.06em 0 .12em;transform:translateY(135%);opacity:0;visibility:hidden;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .3s ease,visibility 0s .65s}
.word .n span{font-weight:400}
.word .s{margin-top:2px;font:500 clamp(13px,2.1vw,20px)/1 Inter,sans-serif;letter-spacing:.34em;text-transform:uppercase;opacity:0;transition:opacity .5s ease .3s}
#intro.words .n{transform:none;opacity:1;visibility:visible;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .3s ease,visibility 0s}
#intro.words .s{opacity:1}

/* Tagline + gate */
.tag{margin:6px 0 0;font:500 clamp(16px,2.4vw,21px)/1.3 Inter,sans-serif;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s var(--ease)}
.tag b{font-weight:700;border-bottom:3px solid var(--navy)}
#intro.tagged .tag{opacity:1;transform:none}
#intro.ready .lock{transform:scale(.8)}
.gatewrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .65s var(--ease);width:100%;max-width:380px}
#intro.ready .gatewrap{grid-template-rows:1fr}
.gatewrap>div{overflow:hidden}
.card{margin:26px 0 4px;background:var(--navy);color:var(--cream);border-radius:20px;padding:22px;opacity:0;transform:translateY(18px);transition:opacity .5s .15s,transform .6s .15s var(--ease)}
#intro.ready .card{opacity:1;transform:none}
.card label.l{display:block;font:600 13px Inter,sans-serif;letter-spacing:.02em;margin-bottom:8px;color:rgba(250,243,234,.85)}
.pwrow{position:relative}
.card input[type=password],.card input[type=text]{width:100%;font:500 16px Inter,sans-serif;color:var(--cream);background:var(--navy-2);border:1.5px solid rgba(250,243,234,.18);border-radius:12px;padding:13px 46px 13px 14px;transition:border-color .2s,box-shadow .2s}
.card input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(208,131,85,.3)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:rgba(250,243,234,.6);padding:8px;cursor:pointer;border-radius:8px}
.eye:hover{color:var(--cream)}
.rem{display:flex;gap:8px;align-items:center;font-size:14px;margin:12px 0 0;cursor:pointer;color:rgba(250,243,234,.85)}
.rem input{accent-color:var(--orange);margin:0;width:16px;height:16px}
.err{min-height:18px;font-size:14px;color:var(--orange-hi);margin:10px 0 0}
.go{margin-top:10px;width:100%;min-height:54px;border:0;border-radius:999px;font:600 17px/1 Inter,sans-serif;color:var(--navy);background:var(--orange);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .2s,background .2s}
.go:hover{background:var(--orange-hi);transform:translateY(-2px)}.go:active{transform:scale(.98)}
.go[disabled]{opacity:.85;cursor:progress;transform:none}
.spin{width:16px;height:16px;border:2px solid rgba(10,34,56,.3);border-top-color:var(--navy);border-radius:50%;animation:rot .7s linear infinite;display:none}
.go.busy .spin{display:block}
.fine{margin:14px 0 0;font-size:12.5px;color:rgba(250,243,234,.6);display:flex;gap:6px;align-items:center;justify-content:center}
.shake{animation:shake .42s}
.status{margin-top:22px;font:600 15px Inter,sans-serif;display:flex;gap:10px;align-items:center;opacity:0;transition:opacity .4s}
.status.on{opacity:1}.status .spin{display:block}
.skip{position:fixed;bottom:18px;right:20px;font:500 13px Inter,sans-serif;color:rgba(10,34,56,.6);background:none;border:0;cursor:pointer;transition:opacity .3s}
#intro.ready .skip{opacity:0;pointer-events:none}

/* Exit */
#intro.out .lock{transform:scale(.9);opacity:0}
#intro.out .tag,#intro.out .gatewrap,#intro.out .status{opacity:0;transition:opacity .35s}
.wipe{position:fixed;inset:0;background:var(--cream);clip-path:circle(0 at var(--x,50%) var(--y,40%));pointer-events:none;z-index:5}
.wipe.go{animation:wipe .75s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wipe{to{clip-path:circle(150% at var(--x,50%) var(--y,40%))}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media (max-width:620px){.lock{flex-direction:column;text-align:center}#intro.ready .lock{transform:scale(.72);margin:-30px 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>

const RKEY='cm_gate_key';
const $=s=>document.querySelector(s);
const intro=$('#intro');
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));

/* intro timeline, same beats as crossmind.ca */
let timers=[],introDone,introP=new Promise(r=>introDone=r);
function finishIntro(){timers.forEach(clearTimeout);intro.classList.add('all','words','tagged');introDone()}
if(reduce){finishIntro()}else{
 requestAnimationFrame(()=>requestAnimationFrame(()=>intro.classList.add('play')));
 timers.push(setTimeout(()=>intro.classList.add('words'),1800));
 timers.push(setTimeout(()=>intro.classList.add('tagged'),2500));
 timers.push(setTimeout(introDone,3300));
 $('#skip').onclick=finishIntro}

async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(P.salt),iterations:P.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt'])}
async function decrypt(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(P.iv)},key,b64d(P.ct));return new TextDecoder().decode(pt)}
async function tryRemembered(){let s=null;try{s=JSON.parse(localStorage.getItem(RKEY))}catch(e){}if(!s)return false;if(!s.k||s.exp<Date.now()||s.v!==P.v){try{localStorage.removeItem(RKEY)}catch(e){}return false}
 try{const key=await crypto.subtle.importKey('raw',b64d(s.k),{name:'AES-GCM'},false,['decrypt']);return await decrypt(key)}catch(e){try{localStorage.removeItem(RKEY)}catch(x){}return false}}

async function reveal(html){const r=$('.mark').getBoundingClientRect();const w=$('#wipe');w.style.setProperty('--x',(r.left+r.width/2)+'px');w.style.setProperty('--y',(r.top+r.height/2)+'px');
 intro.classList.add('out');await wait(380);w.classList.add('go');await wait(800);document.open();document.write(html);document.close()}

let fails=0,lockUntil=0;
async function start(){
 if(!window.crypto||!crypto.subtle){await introP;intro.classList.add('ready');$('#err').textContent='Open this page in an up-to-date browser over https.';return}
 const [html]=await Promise.all([tryRemembered(),introP]);
 if(html){$('#status').classList.add('on');await wait(600);return reveal(html)}
 intro.classList.add('ready');setTimeout(()=>$('#pw').focus(),500)}
$('#eye').onclick=()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password';$('#eye').setAttribute('aria-label',p.type==='password'?'Show password':'Hide password')};
$('#gate').onsubmit=async e=>{e.preventDefault();const err=$('#err'),btn=$('#go'),card=$('#gate'),pw=$('#pw').value;err.textContent='';
 if(Date.now()<lockUntil){err.textContent=`Too many tries. Wait ${Math.ceil((lockUntil-Date.now())/1000)} seconds.`;return}
 if(!pw){err.textContent='Enter the access password.';return}
 btn.disabled=true;btn.classList.add('busy');$('#golbl').textContent='Unlocking';
 try{const key=await derive(pw);const html=await decrypt(key);
  if($('#rem').checked){try{localStorage.setItem(RKEY,JSON.stringify({k:b64e(await crypto.subtle.exportKey('raw',key)),exp:Date.now()+30*864e5,v:P.v}))}catch(x){}}
  else{try{localStorage.removeItem(RKEY)}catch(x){}}
  btn.classList.remove('busy');$('#golbl').textContent='Unlocked';return reveal(html)}
 catch(x){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}btn.disabled=false;btn.classList.remove('busy');$('#golbl').textContent='Unlock';err.textContent='That password didn’t work.';card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');$('#pw').select()}};
start();
})();
</script>
